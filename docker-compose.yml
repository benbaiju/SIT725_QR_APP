services:
  mongodb:
    image: mongo:7
    container_name: sit725-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks: [app-network]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: sit725-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    networks: [app-network]
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: sit725-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks: [app-network]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
